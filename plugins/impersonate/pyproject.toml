[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-impersonate"
version = "0.1.1"
description = "Impersonate plugin for Tungsten: admins log in as any user to see what they see, safely and with a log."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["tungsten", "tungsten-admin", "impersonate", "login as user", "support", "fastapi", "admin"]
dependencies = ["tungsten-admin>=0.1.14"]

[project.urls]
Homepage = "https://tungsten.prisminfoways.com/plugins/impersonate"
Documentation = "https://tungsten.prisminfoways.com/docs/impersonate"
Repository = "https://github.com/Prism-Infoways/Tungsten"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_impersonate"]

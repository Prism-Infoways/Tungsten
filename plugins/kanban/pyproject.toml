[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-kanban"
version = "0.1.1"
description = "Kanban boards for Tungsten: show any resource as drag-and-drop columns, with ready boards for leads, tickets and leave."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["tungsten", "tungsten-admin", "kanban", "board", "drag-and-drop", "pipeline", "fastapi", "admin"]
dependencies = ["tungsten-admin>=0.1.12"]

[project.urls]
Homepage = "https://tungsten.prisminfoways.com/plugins/kanban"
Documentation = "https://tungsten.prisminfoways.com/docs/kanban"
Repository = "https://github.com/Prism-Infoways/Tungsten"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_kanban"]

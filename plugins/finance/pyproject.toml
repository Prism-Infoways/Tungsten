[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-finance"
version = "0.2.0"
description = "Finance and accounts plugin for Tungsten: double-entry books with GST invoices, bills, quotes, notes, stock, P&L, balance sheet and GST returns."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["tungsten", "tungsten-admin", "finance", "accounting", "invoices", "expenses", "gst", "gstr", "ledger", "tally", "fastapi", "admin"]
dependencies = ["tungsten-admin>=0.1.7"]

[project.urls]
Homepage = "https://tungsten.prisminfoways.com/"
Documentation = "https://tungsten.prisminfoways.com/docs/finance.html"
Repository = "https://github.com/Prism-Infoways/Tungsten"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_finance"]

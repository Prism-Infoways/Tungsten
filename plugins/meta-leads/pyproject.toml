[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-meta-leads"
version = "0.1.1"
description = "Tungsten plugin: bring Facebook and Instagram lead form leads into tungsten-leads, with one-click setup."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["tungsten", "tungsten-admin", "facebook", "instagram", "meta", "lead ads", "crm"]
dependencies = ["tungsten-admin>=0.1.3", "tungsten-leads>=0.1.0"]

[project.urls]
Homepage = "https://tungsten.prisminfoways.com/"
Documentation = "https://tungsten.prisminfoways.com/docs/facebook-leads.html"
Repository = "https://github.com/Prism-Infoways/Tungsten"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_meta_leads"]

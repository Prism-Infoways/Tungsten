<div class="grid gap-y-2" {{ attrs(v.extra) }}>
  {% if v.label %}<span class="tw-label">{{ v.label }}</span>{% endif %}
  <div class="tw-fused {{ 'tw-fused-error' if v.has_errors }}" style="--tw-fused-cols: {{ v.columns }}" data-tw-fused>
    {% for c in v.children %}<div class="min-w-0">{{ c }}</div>{% endfor %}
  </div>
  {% if v.helper_text %}<p class="text-sm text-gray-500 dark:text-gray-400">{{ v.helper_text }}</p>{% endif %}
</div>

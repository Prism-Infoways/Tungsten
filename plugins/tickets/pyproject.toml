[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-tickets"
version = "0.1.0"
description = "Help desk plugin for Tungsten: tickets, replies, internal notes, SLA and a customer support page."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["tungsten", "tungsten-admin", "helpdesk", "tickets", "support", "fastapi", "admin"]
dependencies = ["tungsten-admin>=0.1.4"]

[project.urls]
Homepage = "https://tungsten.prisminfoways.com/"
Documentation = "https://tungsten.prisminfoways.com/docs/tickets.html"
Repository = "https://github.com/Prism-Infoways/Tungsten"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_tickets"]

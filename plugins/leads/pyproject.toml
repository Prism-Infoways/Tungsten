[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-leads"
version = "0.1.2"
description = "Leads plugin for Tungsten: lead list, stages, notes and your own form fields."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["tungsten", "tungsten-admin", "crm", "leads", "fastapi", "admin"]
dependencies = ["tungsten-admin>=0.1.3"]

[project.urls]
Homepage = "https://tungsten.prisminfoways.com/"
Repository = "https://github.com/Prism-Infoways/Tungsten"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_leads"]

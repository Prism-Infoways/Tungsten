[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-environment-indicator"
version = "0.1.0"
description = "Tungsten plugin: a Local / Staging / Live badge and colored line in your admin panel, so nobody works on live by mistake."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["tungsten", "tungsten-admin", "environment", "environment indicator", "staging", "production", "admin panel", "fastapi"]
dependencies = ["tungsten-admin>=0.1.4"]

[project.urls]
Homepage = "https://tungsten.prisminfoways.com/plugins/environment-indicator"
Documentation = "https://tungsten.prisminfoways.com/docs/environment-indicator"
Repository = "https://github.com/Prism-Infoways/Tungsten"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_environment_indicator"]

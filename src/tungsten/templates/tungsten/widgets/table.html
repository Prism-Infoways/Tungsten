<div class="h-full [&>[data-tw-table]]:h-full">
  {% if w.heading or link %}
  <div class="tw-card overflow-hidden">
    <header class="flex items-center justify-between px-5 pt-5">
      <div>
        <h3 class="text-base font-semibold text-gray-950 dark:text-white">{{ __(w.heading) }}</h3>
        {% if w.description %}<p class="text-sm text-gray-500 dark:text-gray-400">{{ __(w.description) }}</p>{% endif %}
      </div>
      {% if link %}<a href="{{ link }}" class="flex items-center gap-1 text-sm font-medium {{ colors.LINK.primary }}">{{ __(w.link_label) }}{{ icon('arrow-right', 'h-4 w-4') }}</a>{% endif %}
    </header>
    <div class="mt-3 [&>[data-tw-table]]:rounded-none [&>[data-tw-table]]:shadow-none [&>[data-tw-table]]:ring-0">{{ table.render() }}</div>
  </div>
  {% else %}{{ table.render() }}{% endif %}
</div>

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-filament"
version = "0.1.1"
description = "Move a Laravel Filament admin to Tungsten: converts models, resources, forms, tables, filters, actions and relation managers, on the same database and logins."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["tungsten", "tungsten-admin", "filament", "laravel", "migration", "converter", "fastapi", "admin"]
dependencies = ["tungsten-admin>=0.1.14", "bcrypt>=4.0"]

[project.optional-dependencies]
argon2 = ["argon2-cffi>=23.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://tungsten.prisminfoways.com/plugins/filament-migrate"
Documentation = "https://tungsten.prisminfoways.com/docs/filament-migration"
Repository = "https://github.com/Prism-Infoways/Tungsten"

[project.scripts]
tungsten-filament = "tungsten_filament.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_filament"]

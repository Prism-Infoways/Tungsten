<div class="flex {{ v.justify }}" x-data="{ on: {{ 'true' if v.state else 'false' }} }" data-tw-local>
  <button type="button" role="switch" :aria-checked="on.toString()" data-tw-local
          {% if v.disabled %}disabled{% endif %}
          hx-post="{{ v.endpoint }}" hx-swap="none" hx-trigger="click"
          hx-vals='{{ v.vals | tojson }}'
          @click="on = !on"
          class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full transition-colors duration-200 disabled:cursor-not-allowed disabled:opacity-60"
          :class="on ? 'bg-primary-600' : 'bg-gray-200 dark:bg-gray-700'">
    <span class="pointer-events-none absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition duration-200" :class="on ? 'translate-x-5' : 'translate-x-0.5'"></span>
  </button>
</div>

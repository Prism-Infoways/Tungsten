[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-saved-views"
version = "0.1.1"
description = "Saved table views for Tungsten: users save filters, search, sort and columns as one-click tabs like My Leads or Pending."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["tungsten", "tungsten-admin", "saved views", "filters", "tables", "fastapi", "admin"]
dependencies = ["tungsten-admin>=0.1.12"]

[project.urls]
Homepage = "https://tungsten.prisminfoways.com/"
Documentation = "https://tungsten.prisminfoways.com/docs/saved-views"
Repository = "https://github.com/Prism-Infoways/Tungsten"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_saved_views"]

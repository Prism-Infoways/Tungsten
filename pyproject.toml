[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-admin"
version = "0.1.0"
description = "A Filament-style admin panel builder for FastAPI: resources, forms, tables, actions, widgets, auth and more."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["fastapi", "admin", "panel", "crud", "filament", "sqlalchemy", "htmx"]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
  "fastapi>=0.110",
  "starlette>=0.37",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "typer>=0.12",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.29", "openpyxl>=3.1"]

[project.scripts]
tungsten = "tungsten.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten"]

[tool.hatch.build.targets.sdist]
include = ["src/tungsten", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

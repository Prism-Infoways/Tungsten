[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-blog"
version = "0.1.0"
description = "Tungsten plugin: a blog built for SEO, GEO and AEO, with a live score in the editor, schema.org data, sitemap, RSS and llms.txt."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["tungsten", "tungsten-admin", "blog", "cms", "seo", "geo", "aeo", "llms.txt", "schema.org", "fastapi"]
dependencies = ["tungsten-admin>=0.1.5"]

[project.urls]
Homepage = "https://tungsten.prisminfoways.com/"
Documentation = "https://tungsten.prisminfoways.com/docs/blog.html"
Repository = "https://github.com/Prism-Infoways/Tungsten"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_blog"]

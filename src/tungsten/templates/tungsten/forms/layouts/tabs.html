{% set ids = v.ids | tojson | forceescape %}
<div class="{{ 'tw-card' if v.contained }}" x-data="{ tab: '{{ v.active }}', ids: {{ ids }} }"
     {% if v.query_key or v.persist %}x-init="
       {% if v.persist and not v.has_errors %}try { const saved = localStorage.getItem('tw-tab:' + location.pathname + ':{{ v.key }}'); if (saved !== null && ids[saved] !== undefined) tab = saved; } catch (e) {}{% endif %}
       $watch('tab', (t) => {
         {% if v.query_key %}const u = new URL(location.href); u.searchParams.set('{{ v.query_key }}', ids[t]); history.replaceState(history.state, '', u);{% endif %}
         {% if v.persist %}try { localStorage.setItem('tw-tab:' + location.pathname + ':{{ v.key }}', t); } catch (e) {}{% endif %}
       })"{% endif %}>
  <input type="hidden" name="_tw_ui.{{ v.key }}" :value="tab" value="{{ v.active }}">
  <nav class="{{ 'px-4 pt-4' if v.contained }}" role="tablist"><div class="tw-pill-nav tw-pill-nav-muted">
    {% for t in v.tabs %}
    <button type="button" role="tab" @click="tab = '{{ t.index }}'"
            class="tw-pill-nav-item py-1.5" :class="tab === '{{ t.index }}' && 'tw-pill-nav-item-active'" :aria-selected="tab === '{{ t.index }}'">
      {{ icon(t.icon, 'h-4 w-4') }}{{ t.label }}
      {% if t.errors %}<span class="rounded-full bg-danger-50 px-1.5 text-xs text-danger-600 dark:bg-danger-500/10 dark:text-danger-400">{{ t.errors }}</span>
      {% elif t.badge %}<span class="rounded-full bg-gray-100 px-1.5 text-xs text-gray-600 dark:bg-white/10 dark:text-gray-300">{{ t.badge }}</span>{% endif %}
    </button>
    {% endfor %}
  </div></nav>
  {% for t in v.tabs %}
  <div class="{{ 'p-6' if v.contained else 'pt-6' }}" x-show="tab === '{{ t.index }}'" {% if v.active != t.index|string %}x-cloak{% endif %} role="tabpanel">
    {{ form.render_schema(t.tab.child_components(), v.base, t.tab._columns) }}
  </div>
  {% endfor %}
</div>

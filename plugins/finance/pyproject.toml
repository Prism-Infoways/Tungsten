[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-finance"
version = "0.1.0"
description = "Finance and accounts plugin for Tungsten: invoices with GST, payments, expenses, bank balances and profit reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["tungsten", "tungsten-admin", "finance", "accounting", "invoices", "expenses", "gst", "fastapi", "admin"]
dependencies = ["tungsten-admin>=0.1.5"]

[project.urls]
Homepage = "https://tungsten.prisminfoways.com/"
Documentation = "https://tungsten.prisminfoways.com/docs/finance.html"
Repository = "https://github.com/Prism-Infoways/Tungsten"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_finance"]

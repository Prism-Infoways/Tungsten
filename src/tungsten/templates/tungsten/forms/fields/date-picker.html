{% from "tungsten/forms/macros.html" import wrapper, mirror, affixes %}
{% call wrapper(field, v) %}
{% call affixes(v) %}
<input id="{{ v.id }}" name="{{ v.path }}" type="{{ v.input_type }}" value="{{ v.state or '' }}"
       class="tw-input {{ 'tw-input-error' if v.errors }} dark:[color-scheme:dark]"
       {% if v.min %}min="{{ v.min }}"{% endif %} {% if v.max %}max="{{ v.max }}"{% endif %} {% if v.step %}step="{{ v.step }}"{% endif %}
       {% if v.disabled %}disabled{% endif %} {{ v.live }} {{ v.extra }}>
{% if v.timezone %}<p class="mt-1 flex items-center gap-x-1 text-xs text-gray-500 dark:text-gray-400">{{ icon('globe', 'h-3.5 w-3.5') }}{{ v.timezone }}</p>{% endif %}
{% endcall %}
{{ mirror(v) }}
{% endcall %}

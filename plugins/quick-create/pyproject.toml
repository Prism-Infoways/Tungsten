[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tungsten-quick-create"
version = "0.1.0"
description = "Quick Create plugin for Tungsten: a + New button in the top bar to add any record from any page."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prism Infoways" }]
keywords = ["tungsten", "tungsten-admin", "quick-create", "shortcut", "productivity", "fastapi", "admin"]
dependencies = ["tungsten-admin>=0.1.7"]

[project.urls]
Homepage = "https://tungsten.prisminfoways.com/"
Documentation = "https://tungsten.prisminfoways.com/docs/quick-create"
Repository = "https://github.com/Prism-Infoways/Tungsten"

[tool.hatch.build.targets.wheel]
packages = ["src/tungsten_quick_create"]

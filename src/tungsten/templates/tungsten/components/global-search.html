<div class="relative w-full max-w-md" x-data="{ open: false }" @tw-open-search.window="$refs.q.focus(); open = true"
     @click.outside="open = false" @keydown.escape="open = false; $refs.q.blur()">
  <label class="relative block">
    <span class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-3 text-gray-400">{{ icon('search', 'h-4 w-4') }}</span>
    <input x-ref="q" type="search" name="q" placeholder="{{ __('Search everything...') }}"
           autocomplete="off" class="tw-input bg-gray-50 ps-9 pe-14 dark:bg-white/5" @focus="open = true" @input="open = true"
           hx-get="{{ panel.url('_tw', 'search') }}" hx-trigger="input changed delay:250ms, search" hx-target="#tw-search-results" hx-swap="innerHTML">
    <kbd class="pointer-events-none absolute inset-y-0 end-2 my-auto hidden h-6 items-center rounded-md border border-gray-200 px-1.5 text-xs text-gray-400 sm:flex dark:border-white/10">⌘K</kbd>
  </label>
  <div x-show="open" x-cloak class="absolute inset-x-0 top-full z-40 mt-2 max-h-[70vh] overflow-y-auto rounded-xl bg-white shadow-xl ring-1 ring-gray-950/5 dark:bg-gray-900 dark:ring-white/10">
    <div id="tw-search-results"><p class="px-4 py-6 text-center text-sm text-gray-500">{{ __('Type to search across the panel.') }}</p></div>
  </div>
</div>

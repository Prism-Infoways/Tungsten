<div class="{{ 'grid grid-cols-3 items-start gap-x-4' if v.inline else 'grid gap-y-1.5' }}">
  {% if v.show_label %}
  <dt class="flex items-center gap-x-1 text-sm font-medium text-gray-500 dark:text-gray-400">
    {{ v.label }}{% if v.hint %}<span class="ms-auto flex items-center gap-1 text-xs font-normal">{{ __(v.hint) }}{{ icon(v.hint_icon, 'h-3.5 w-3.5') }}</span>{% endif %}
  </dt>
  {% endif %}
  <dd class="{{ 'col-span-2' if v.inline }} min-w-0 text-gray-950 dark:text-white">{{ cell }}</dd>
  {% if v.helper_text %}<p class="text-xs text-gray-500 dark:text-gray-400 {{ 'col-span-3' if v.inline }}">{{ __(v.helper_text) }}</p>{% endif %}
</div>
